[package]
name = "tempoch"
version = "0.7.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Astronomical time primitives: typed time scales, Julian dates, UTC conversion, and interval operations."
license = "AGPL-3.0-only"
readme = "../README.md"
repository = "https://github.com/Siderust/tempoch"
keywords = ["astronomy", "time", "julian-date", "ephemeris", "no-std"]
categories = ["science", "date-and-time", "no-std"]

[lib]
name = "tempoch"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "tempoch-core/std"]
alloc = ["tempoch-core/alloc"]
serde = ["tempoch-core/serde"]
runtime-data-fetch = ["std", "tempoch-core/runtime-data-fetch"]

[dependencies]
tempoch-core = { path = "../tempoch-core", version = "0.7.0", default-features = false }

[dev-dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[[example]]
name = "05_serde"
path = "examples/05_serde.rs"
required-features = ["serde"]

[[example]]
name = "06_runtime_tables"
path = "examples/06_runtime_tables.rs"
required-features = ["runtime-data-fetch"]
