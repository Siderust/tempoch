[package]
name = "tempoch-core"
version = "0.7.0"
edition = "2021"
authors = ["VPRamon <vallespuigramon@gmail.com>"]
description = "Core astronomical time primitives for tempoch."
license = "AGPL-3.0-only"
repository = "https://github.com/Siderust/tempoch"
keywords = ["astronomy", "time", "julian-date", "no-std"]
categories = ["science", "date-and-time", "no-std"]

[features]
default = ["std"]
std = ["alloc", "affn/std", "chrono/clock", "chrono/std", "siderust-archive/std"]
alloc = ["affn/alloc", "chrono/alloc"]
serde = ["dep:serde", "alloc", "affn/serde"]
runtime-data-fetch = ["std", "siderust-archive/fetch"]

[lib]
name = "tempoch_core"
path = "src/lib.rs"

[dependencies]
# `astro` forwards `qtty/astro` (incl. `julian-time`); quantities come via `affn::qtty`.
affn = { version = "0.10", default-features = false, features = ["astro"] }
chrono = { version = "0.4", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"], optional = true }
siderust-archive = { version = "0.1.5", default-features = false, features = ["time"] }

[dev-dependencies]
serde_json = "1"
proptest = "1"
